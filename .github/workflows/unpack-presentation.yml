name: Publish interactive presentation

on:
  push:
    branches: [main]
    paths:
      - '.deploy/**'
      - '.github/workflows/unpack-presentation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rebuild and unpack presentation
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/presentation.zip
          for f in $(find .deploy -maxdepth 1 -type f -name 'chunk-*.b64' | sort); do
            echo "Decoding $f"
            base64 --ignore-garbage -d "$f" >> /tmp/presentation.zip
          done
          unzip -t /tmp/presentation.zip
          unzip -o /tmp/presentation.zip -d .

      - name: Verify presentation entry points
        run: |
          test -f index.html
          test -f hub.html
          test -f css/main.css
          test -f js/presentation.js
          test -f modules/01-understand/index.html
          test -f modules/05-agents/index.html
          echo "Presentation bundle verified."

      - name: Commit published presentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll index.html hub.html css js modules overview final content scss
          if git diff --cached --quiet; then
            echo "No presentation changes to publish."
            exit 0
          fi
          git commit -m "Publish interactive lecture presentation"
          git push origin HEAD:main
