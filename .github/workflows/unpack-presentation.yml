name: Publish interactive presentation

on:
  push:
    branches: [main]
    paths:
      - '.deploy/**'
      - '.github/workflows/unpack-presentation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rebuild and unpack presentation
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/presentation.zip
          for f in $(find .deploy -maxdepth 1 -type f -name 'chunk-*.b64' | sort); do
            echo "Decoding $f"
            base64 --ignore-garbage -d "$f" >> /tmp/presentation.zip
          done

          set +e
          unzip -o /tmp/presentation.zip -d .
          unzip_rc=$?
          set -e
          if [ "$unzip_rc" -ne 0 ]; then
            echo "Bundle extracted with a recoverable archive warning (exit $unzip_rc)."
          fi

          mkdir -p final
          cp .deploy/final-index.html final/index.html

      - name: Verify presentation entry points
        run: |
          test -f .nojekyll
          test -f index.html
          test -f hub.html
          test -f css/main.css
          test -f js/fx.js
          test -f js/presentation.js
          test -f overview/index.html
          test -f modules/01-understand/index.html
          test -f modules/02-prompt/index.html
          test -f modules/03-context/index.html
          test -f modules/04-workflow/index.html
          test -f modules/05-agents/index.html
          test -f final/index.html
          grep -q 'data-slide-id="S60"' final/index.html
          echo "Presentation bundle verified."

      - name: Commit published presentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll index.html hub.html css js modules overview final content scss
          if git diff --cached --quiet; then
            echo "No presentation changes to publish."
            exit 0
          fi
          git commit -m "Publish interactive lecture presentation"
          git push origin HEAD:main
