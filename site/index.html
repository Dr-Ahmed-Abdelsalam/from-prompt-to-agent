<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020a1b" />
    <title>من مخاطبة الآلة إلى تفويضها</title>
    <link rel="stylesheet" href="./assets/site.css?v=20260830-react" />
  </head>
  <body>
    <main id="presentation" aria-live="polite">
      <div class="motion-layer" aria-hidden="true"><i class="wave wave-blue"></i><i class="wave wave-orange"></i><i class="trace"></i><i class="grain"></i></div>
      <header class="topbar"><div class="brand"><img src="./assets/academy-logo.png" alt="أكاديمية العدالة"><span>أكاديمية العدالة</span></div><span id="axis-label"></span><span class="slide-counter" id="counter">S01 <i>/ 60</i></span></header>
      <section id="slide" class="slide"></section>
      <div class="progress"><span id="progress-fill"></span></div>
      <button class="edge edge-prev" id="prev" aria-label="الشريحة السابقة">‹</button><button class="edge edge-next" id="next" aria-label="الشريحة التالية">›</button>
      <footer class="bottom"><span class="key-hint"><b>F</b> ملء الشاشة</span><nav><button id="nav-prev" aria-label="الشريحة السابقة">←</button><button id="nav-next" aria-label="الشريحة التالية">→</button><button id="hub" aria-label="الخريطة الرئيسية">⌘</button><button id="map" aria-label="خريطة المحور">⌖</button><button id="fullscreen" aria-label="ملء الشاشة">⛶</button></nav></footer>
    </main>
    <script src="./assets/site.js?v=20260830-react"></script>
  </body>
</html>
